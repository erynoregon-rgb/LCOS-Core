    section: "3. Worked Fixture"
    claim_text: "An unsupported draft using forbidden language is converted into HOLD_CONTRACT_VIOLATION and does not receive downstream admission."
    claim_safety_tag: VERIFIED
    evidence_path: "fixtures/adversarial/ai_drafting_drift/"
    test_path: "tests/test_ai_drafting_drift_fixture.py"
    action: keep

  - claim_id: L2-grounded-accept
    section: "3. Worked Fixture"
    claim_text: "A grounded draft satisfying the contract receives an EXECUTION_ACCEPTED receipt."
    claim_safety_tag: VERIFIED
    evidence_path: "fixtures/adversarial/grounded_accept/"
    test_path: "tests/test_ai_drafting_drift_fixture.py"
    action: keep

  - claim_id: L3-ledger-replay
    section: "2. LCOS Mechanism"
    claim_text: "LCOS records HOLD and accepted outcomes in an append-only ledger and renders a replayable timeline."
    claim_safety_tag: VERIFIED
    evidence_path: "src/lcos_public/ledger.py; src/lcos_public/replay.py"
    test_path: "tests/test_ai_drafting_drift_fixture.py"
    action: keep

  - claim_id: L4-public-proof-artifact
    section: "2. LCOS Mechanism"
    claim_text: "LCOS is a bounded public proof artifact whose claims must be inspectable from LCOS-local files."
