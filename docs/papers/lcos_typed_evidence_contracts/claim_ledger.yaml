    claim_text: "The proof pair is stronger than rejection alone because it distinguishes grounded from unsupported transition attempts."
    claim_safety_tag: HYPOTHESIS
    evidence_path: "tests/test_ai_drafting_drift_fixture.py"
    test_path: null
    action: keep

  - claim_id: L6-polished-vs-grounded
    section: "1. Problem"
    claim_text: "A polished unsupported claim is worse than an awkward grounded claim."
    claim_safety_tag: HYPOTHESIS
    evidence_path: "docs/papers/lcos_typed_evidence_contracts/paper.md"
    test_path: null
    action: keep

  - claim_id: L7-hold-first-class
    section: "2. LCOS Mechanism"
