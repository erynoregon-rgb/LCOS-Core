schema_version: "1.0"
paper: "Typed Evidence Contracts for Blocking Unsupported AI-Assisted Claims"
revision: "LCOS-native proof pair"
claim_safety_tag_legend:
  VERIFIED: "LCOS-local code plus passing tests"
  REPO_IMPLEMENTED: "LCOS-local implementation exists"
  SPECIFIED: "Documented design or fixture contract"
  HYPOTHESIS: "Interpretive claim or future evidence need"
  REMOVE: "Unsupported claim; should not appear as a result"

claims:
