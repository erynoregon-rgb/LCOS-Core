    evidence_path: "docs/papers/lcos_typed_evidence_contracts/"
    test_path: "tests/test_ai_drafting_drift_fixture.py"
    action: keep

summary:
  verified: 4
  repo_implemented: 0
  specified: 2
  hypothesis: 2
